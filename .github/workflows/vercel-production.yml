name: Deploy benchmark publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'aithosinnovation/aithos-vulkan-tensor-parallel' && github.ref == 'refs/heads/main'
    environment: benchmark-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify measurements and file integrity
        run: python3 -I -B scripts/verify.py

      - name: Require credentials for the existing benchmark project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import os
          import sys

          for name in ('VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID'):
              if not os.environ.get(name):
                  sys.exit(f'Required encrypted Actions secret {name} is missing.')
          # Identity digests prevent a mistaken secret from targeting another project.
          expected = {
              'VERCEL_ORG_ID': 'e78571b998da146365267a86cdcbdbc1a4f3b2449bc6fd2964046f9ee64bb635',
              'VERCEL_PROJECT_ID': 'a20a652f5fc42606e274ad4217e9082aa3538ead7ea3da02c215736e450b2422',
          }
          for name, digest in expected.items():
              if hashlib.sha256(os.environ[name].encode()).hexdigest() != digest:
                  sys.exit(f'{name} does not identify the approved benchmark project.')
          PYCODE

      - name: Verify dedicated token access safely
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          original = os.environ['VERCEL_TOKEN']
          token = original.strip()
          print('Token surrounding whitespace present:', token != original)
          team = os.environ['VERCEL_ORG_ID']
          project = os.environ['VERCEL_PROJECT_ID']
          def probe(label, path):
              request = Request('https://api.vercel.com' + path,
                                headers={'Authorization': 'Bearer ' + token})
              try:
                  with urlopen(request, timeout=30) as response:
                      status, data = response.status, json.load(response)
              except HTTPError as error:
                  status = error.code
                  try:
                      data = json.load(error)
                  except (ValueError, OSError):
                      data = {}
              code = data.get('error', {}).get('code', '')
              safe_code = code if isinstance(code, str) and re.fullmatch(r'[A-Za-z0-9_-]{0,64}', code) else 'unknown'
              print(f'{label}: HTTP {status}; error_code={safe_code or "none"}')
              return status, data
          user_status, _ = probe('Vercel user access', '/v2/user')
          scoped_status, _ = probe('Team-scoped user access', '/v2/user?teamId=' + team)
          project_status, data = probe('Existing project access', '/v9/projects/' + project + '?teamId=' + team)
          project_matches = data.get('id') == project and data.get('accountId') == team
          print('Existing benchmark project identity matches:', project_matches)
          if project_status != 200 or not project_matches:
              sys.exit('Dedicated token cannot access the approved benchmark project; deployment stopped.')
          if user_status != 200 and scoped_status != 200:
              print('Using verified project-linked CI context; account-level lookup is unavailable.')
          PYCODE

      - name: Use the validated Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Install the pinned official Vercel CLI
        run: npm install --global vercel@64.5.0

      - name: Deploy only the existing benchmark project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CI: '1'
        run: |
          python3 - <<'PYCODE'
          import os
          import subprocess
          import sys
          tip = subprocess.check_output([
              'git', 'ls-remote',
              'https://github.com/aithosinnovation/aithos-vulkan-tensor-parallel.git',
              'refs/heads/main',
          ], text=True).split()[0]
          if tip != os.environ['GITHUB_SHA']:
              sys.exit('This run is stale; only current main may be deployed.')
          PYCODE
          python3 - <<'PYCODE'
          import os
          import subprocess
          from pathlib import Path
          env = os.environ.copy()
          env['VERCEL_TOKEN'] = env['VERCEL_TOKEN'].strip()
          with Path(env['RUNNER_TEMP'], 'benchmark-deployment.json').open('w', encoding='utf-8') as output:
              subprocess.run([
                  'vercel', 'deploy', '--prod', '--yes', '--non-interactive', '--json',
              ], env=env, stdout=output, check=True)
          PYCODE
          python3 - "$RUNNER_TEMP/benchmark-deployment.json" <<'PYCODE'
          import json
          import sys
          import os
          from pathlib import Path
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          deploy = data.get('deployment', data)
          if data.get('status', 'ok') != 'ok' or deploy.get('readyState') != 'READY' or deploy.get('target') != 'production':
              sys.exit('Vercel did not confirm a ready deployment.')
          if deploy.get('productionUrl') != 'https://aithos-vulkan-tensor-parallel.vercel.app':
              sys.exit('Unexpected production URL; inspect the existing project before retrying.')
          url = deploy.get('url', '')
          if not url.startswith('https://aithos-vulkan-tensor-parallel-') or not url.endswith('.vercel.app'):
              sys.exit('Unexpected immutable deployment URL.')
          Path(os.environ['RUNNER_TEMP'], 'benchmark-deployment-url').write_text(url, encoding='utf-8')
          print('Existing benchmark production deployment is ready.')
          PYCODE

      - name: Verify the live publication against this commit
        run: |
          python3 -I -B scripts/verify_site.py "$(cat "$RUNNER_TEMP/benchmark-deployment-url")"
          python3 -I -B scripts/verify_site.py
